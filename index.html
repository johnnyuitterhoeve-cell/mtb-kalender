<body class="bg-slate-950 text-slate-100 min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        const TOWN_COORDINATES = {
            "'s-Heer Arendskerke": { lat: 51.4939, lng: 3.8211 },
            "Herentals": { lat: 51.1764, lng: 4.8361 },
            "Minderhout": { lat: 51.4167, lng: 4.7667 },
            "Weelde": { lat: 51.4075, lng: 4.9972 },
            "As": { lat: 51.0089, lng: 5.5861 },
            "Baardegem": { lat: 50.9631, lng: 4.1450 },
            "Moerzeke": { lat: 51.0608, lng: 4.1706 },
            "Sint-Martens-Latem": { lat: 51.0189, lng: 3.6397 },
            "Aarschot": { lat: 50.9861, lng: 4.8333 },
            "Hoeilaart": { lat: 50.7667, lng: 4.4667 },
            "Ieper": { lat: 50.8511, lng: 2.8858 },
            "Rhenen": { lat: 51.9583, lng: 5.5667 },
            "Gulpen": { lat: 50.8144, lng: 5.8900 },
            "Oudenaarde": { lat: 50.8466, lng: 3.6053 },
            "Nunspeet": { lat: 52.3333, lng: 5.7833 },
            "Houffalize": { lat: 50.1311, lng: 5.7892 },
            "Lille": { lat: 51.2394, lng: 4.8239 },
            "Lochristi": { lat: 51.0967, lng: 3.8347 },
            "Helchteren": { lat: 51.0583, lng: 5.3789 },
            "Oostakker": { lat: 51.0850, lng: 3.7611 },
            "Hasselt": { lat: 50.9311, lng: 5.3378 },
            "Breda": { lat: 51.5868, lng: 4.7759 }
        };

        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                      Math.sin(dLon/2) * Math.sin(dLon/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return Math.round(R * c * 1.25);
        }

        function formatDateNL(dateStr) {
            if (!dateStr) return '';
            const parts = dateStr.split('-');
            if (parts.length !== 3) return dateStr;
            return `${parts[2]}-${parts[1]}-${parts[0]}`;
        }

        function App() {
            const [homeTown, setHomeTown] = React.useState("'s-Heer Arendskerke");
            const [selectedDiscipline, setSelectedDiscipline] = React.useState('All');
            const [selectedExactDate, setSelectedExactDate] = React.useState(''); // Echte specifieke datum
            const [sortBy, setSortBy] = React.useState('date'); // 'date' of 'distance'
            const [maxDistance, setMaxDistance] = React.useState(250);
            const [minRouteLength, setMinRouteLength] = React.useState(0);
            const [searchQuery, setSearchQuery] = React.useState('');
            const [favorites, setFavorites] = React.useState([]);
            const [onlyFavorites, setOnlyFavorites] = React.useState(false);
            const [showAddModal, setShowAddModal] = React.useState(false);
            const [events, setEvents] = React.useState([]);

            React.useEffect(() => {
                fetch('./events.json')
                    .then(res => res.json())
                    .then(data => setEvents(data))
                    .catch(err => console.log("Laden van events.json mislukt", err));
            }, []);

            const [newTitle, setNewTitle] = React.useState('');
            const [newDate, setNewDate] = React.useState('');
            const [newLocation, setNewLocation] = React.useState('Breda');
            const [newType, setNewType] = React.useState('Gravel');
            const [newDistances, setNewDistances] = React.useState('40, 60, 90');
            const [newSourceUrl, setNewSourceUrl] = React.useState('https://www.mountainbike.be/toertochten-overzicht');

            const homeCoords = TOWN_COORDINATES[homeTown] || TOWN_COORDINATES["'s-Heer Arendskerke"];

            const toggleFavorite = (id) => {
                setFavorites(prev => prev.includes(id) ? prev.filter(f => f !== id) : [...prev, id]);
            };

            const handleAddEvent = (e) => {
                e.preventDefault();
                const distArray = newDistances.split(',').map(d => parseInt(d.trim())).filter(n => !isNaN(n));
                const newEvt = {
                    id: 'evt-' + Date.now(),
                    title: newTitle,
                    date: newDate,
                    location: newLocation,
                    type: newType,
                    distances: distArray.length ? distArray : [50],
                    organizer: "Handmatig toegevoegd",
                    sourceUrl: newSourceUrl || "https://www.mountainbike.be/toertochten-overzicht",
                    price: "€ 10.00"
                };
                setEvents([...events, newEvt]);
                setShowAddModal(false);
                setNewTitle('');
            };

            const filteredEvents = events
                .filter(event => {
                    if (selectedDiscipline !== 'All' && event.type !== 'Both' && event.type !== selectedDiscipline) return false;
                    
                    // Filter exact op de gekozen datum indien ingevuld
                    if (selectedExactDate && selectedExactDate !== '') {
                        if (event.date !== selectedExactDate) return false;
                    }

                    if (onlyFavorites && !favorites.includes(event.id)) return false;
                    if (searchQuery && !event.title.toLowerCase().includes(searchQuery.toLowerCase()) && !event.location.toLowerCase().includes(searchQuery.toLowerCase()) && !event.organizer.toLowerCase().includes(searchQuery.toLowerCase())) return false;
                    
                    const eventCoords = TOWN_COORDINATES[event.location];
                    if (eventCoords) {
                        const dist = calculateDistance(homeCoords.lat, homeCoords.lng, eventCoords.lat, eventCoords.lng);
                        if (dist > maxDistance) return false;
                    }
                    
                    if (minRouteLength > 0 && !event.distances.some(d => d >= minRouteLength)) return false;
                    return true;
                })
                .sort((a, b) => {
                    if (sortBy === 'distance') {
                        const coordA = TOWN_COORDINATES[a.location];
                        const coordB = TOWN_COORDINATES[b.location];
                        const distA = coordA ? calculateDistance(homeCoords.lat, homeCoords.lng, coordA.lat, coordA.lng) : 9999;
                        const distB = coordB ? calculateDistance(homeCoords.lat, homeCoords.lng, coordB.lat, coordB.lng) : 9999;
