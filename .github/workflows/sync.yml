name: Synchroniseer Toertochten

on:
  schedule:
    - cron: '0 6 * * *' # Draait elke ochtend om 06:00 uur automatisch
  workflow_dispatch: # Zodat je hem ook handmatig kunt aanklikken op GitHub!

jobs:
  sync:
  ---
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Python instellen
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Benodigde pakketten installeren
        run: |
          pip install requests beautifulsoup4

      - name: Scraper script uitvoeren
        run: python scrape.py

      - name: Wijzigingen opslaan in events.json
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "bot@users.noreply.github.com"
          git add events.json
          git diff --quiet && git diff --cached --quiet || (git commit -m "Automatische update van toertochten databronnen" && git push)
