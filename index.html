<!DOCTYPE html>
<html lang="nl">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MTB & Gravel Kalender</title>
    <script src="https://cdn.tailwindcss.com"></script>

            <div>

                    <span>🚴</span> MTB & Gravel Kalender
                </h1>
                <p class="text-slate-400 text-sm mt-1">Automatisch gesynchroniseerd met al je favoriete websites</p>
            </div>
        </header>

            <aside class="bg-slate-900 p-6 rounded-xl border border-slate-800 h-fit space-y-6">

                <div>

                        <option value="s-Heer Arendskerke">'s-Heer Arendskerke</option>
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-2">Type Fiets:</label>
                    <div id="typeFilters" class="flex gap-2">
                        <button class="type-btn px-4 py-2 rounded-lg text-sm font-medium bg-emerald-600 text-white" data-type="Alle">Alle</button>
                        <button class="type-btn px-4 py-2 rounded-lg text-sm font-medium bg-slate-800 text-slate-300 hover:bg-slate-700" data-type="MTB">MTB</button>
                        <button class="type-btn px-4 py-2 rounded-lg text-sm font-medium bg-slate-800 text-slate-300 hover:bg-slate-700" data-type="Gravel">Gravel</button>
                    </div>
                </div>
            </aside>

            <!-- Hoofdinhoud -->
            <main class="lg:col-span-3 space-y-4">
                <div class="flex gap-4 mb-6">
                    <input type="text" id="searchInput" placeholder="Zoek op plaatsnaam, titel of organisatie..." class="flex-1 bg-slate-900 border border-slate-800 rounded-lg px-4 py-3 text-slate-100 placeholder-slate-500 focus:outline-none focus:border-emerald-500">
                    <input type="date" id="dateInput" class="bg-slate-900 border border-slate-800 rounded-lg px-4 py-3 text-slate-100 focus:outline-none focus:border-emerald-500">
                </div>

                <div id="eventsContainer" class="space-y-4">
                    <!-- Evenementen worden hier dynamisch ingeladen -->
                </div>
            </main>
        </div>
    </div>
