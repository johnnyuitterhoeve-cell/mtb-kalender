<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MTB & Gravel Kalender</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
    <div class="max-w-7xl mx-auto px-4 py-8">
        <header class="flex justify-between items-center mb-8 border-b border-slate-800 pb-4">
            <div>
                <h1 class="text-3xl font-bold flex items-center gap-2"><span>🚴</span> MTB & Gravel Kalender</h1>
                <p class="text-slate-400 text-sm mt-1">Automatisch gesynchroniseerd met al je favoriete websites</p>
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-4 gap-8">
            <aside class="bg-slate-900 p-6 rounded-xl border border-slate-800 h-fit space-y-6 flex flex-col justify-between">
                <div class="space-y-6">
                    <h2 class="text-xl font-semibold text-emerald-400">Filters & Instellingen</h2>

                    <div>
                        <label for="postcodeInput" class="block text-sm font-medium text-slate-300 mb-2">Jouw postcode:</label>
                        <div class="flex gap-2">
                            <input type="text" id="postcodeInput" placeholder="bv. 4411AB of 2300" maxlength="7" class="min-w-0 flex-1 bg-slate-800 border border-slate-700 rounded-lg p-2.5 text-slate-200 placeholder-slate-500 focus:outline-none focus:border-emerald-500">
                            <select id="countrySelect" class="bg-slate-800 border border-slate-700 rounded-lg px-2 text-slate-200 focus:outline-none focus:border-emerald-500">
                                <option value="nl">NL</option>
                                <option value="be">BE</option>
                            </select>
                            <button id="postcodeBtn" type="button" class="px-3 rounded-lg bg-emerald-600 text-white text-sm font-medium hover:bg-emerald-500">OK</button>
                        </div>
                        <p id="originLabel" class="text-xs text-slate-400 mt-2"></p>
                    </div>

                    <div>
                        <span class="block text-sm font-medium text-slate-300 mb-2">Type fiets:</span>
                        <div id="typeFilters" class="flex gap-2">
                            <button class="type-btn px-4 py-2 rounded-lg text-sm font-medium bg-emerald-600 text-white" data-type="Alle">Alle</button>
                            <button class="type-btn px-4 py-2 rounded-lg text-sm font-medium bg-slate-800 text-slate-300 hover:bg-slate-700" data-type="MTB">MTB</button>
                            <button class="type-btn px-4 py-2 rounded-lg text-sm font-medium bg-slate-800 text-slate-300 hover:bg-slate-700" data-type="Gravel">Gravel</button>
                        </div>
                    </div>

                    <div>
                        <label for="maxDistance" class="block text-sm font-medium text-slate-300 mb-2">Max. reisafstand: <span id="maxDistVal" class="text-emerald-400">250</span> km</label>
                        <input type="range" id="maxDistance" min="10" max="250" value="250" class="w-full accent-emerald-500 cursor-pointer">
                    </div>

                    <div>
                        <label for="minDistance" class="block text-sm font-medium text-slate-300 mb-2">Min. parcourslengte: <span id="minDistVal" class="text-emerald-400">Alle</span></label>
                        <input type="range" id="minDistance" min="0" max="100" value="0" step="5" class="w-full accent-emerald-500 cursor-pointer">
                    </div>

                </div>

                <div class="pt-6 border-t border-slate-800 space-y-2">
                    <h3 class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Bronnen</h3>
                    <ul id="sourceList" class="text-xs text-slate-400 space-y-1.5"></ul>
                    <p id="sourceUpdated" class="text-xs text-slate-500 pt-1"></p>
                </div>
            </aside>

            <main class="lg:col-span-3 space-y-4">
                <div class="flex flex-col sm:flex-row gap-4 mb-2">
                    <input type="text" id="searchInput" placeholder="Zoek op plaatsnaam, titel of organisatie..." class="flex-1 bg-slate-900 border border-slate-800 rounded-lg px-4 py-3 text-slate-100 placeholder-slate-500 focus:outline-none focus:border-emerald-500">
                    <div class="relative sm:w-56">
                        <input type="hidden" id="dateInput" value="">
                        <button type="button" id="dateBtn" class="w-full h-full bg-slate-900 border border-slate-800 rounded-lg px-4 py-3 text-left text-slate-100 hover:border-slate-700 focus:outline-none focus:border-emerald-500 flex items-center justify-between gap-3">
                            <span id="dateBtnLabel">Alle datums</span><span>📅</span>
                        </button>
                        <div id="calendarPop" class="hidden absolute right-0 mt-2 z-20 w-72 bg-slate-900 border border-slate-700 rounded-xl shadow-xl p-4"></div>
                    </div>
                </div>
                <p id="statusLine" class="text-xs text-slate-500"></p>
                <div id="eventsContainer" class="space-y-4"></div>
            </main>
        </div>
    </div>

    <script>
    (function () {
        'use strict';

        // ---------- Coördinaten (lat/lon) ----------
        var coordinates = {
            "'s-Heer Arendskerke": { lat: 51.488, lon: 3.864 },
            "Roosendaal": { lat: 51.532, lon: 4.462 },
            "Herentals": { lat: 51.178, lon: 4.833 },
            "Minderhout": { lat: 51.391, lon: 4.764 },
            "Weelde": { lat: 51.428, lon: 4.939 },
            "Baardegem": { lat: 50.950, lon: 4.075 },
            "Moerzeke": { lat: 51.055, lon: 4.130 },
            "Hoeilaart": { lat: 50.743, lon: 4.472 },
            "As": { lat: 50.967, lon: 5.583 },
            "Sint-Martens-Latem": { lat: 51.017, lon: 3.633 },
            "Aarschot": { lat: 50.983, lon: 4.833 },
            "Ieper": { lat: 50.850, lon: 2.883 },
            "Lochristi": { lat: 51.093, lon: 3.833 },
            "Helchteren": { lat: 51.067, lon: 5.367 },
            "Lille": { lat: 51.243, lon: 4.817 },
            "Oostakker": { lat: 51.083, lon: 3.783 },
            "Rhenen": { lat: 51.959, lon: 5.567 }
        };

        // ---------- Fallback-data (wordt gebruikt als events.json niet laadt) ----------
        var D = '2026-11-01', MB = 'https://www.mountainbike.be/toertochten-overzicht';
        function ev(id, title, date, location, type, distances, organizer, url, price) {
            return { id: id, title: title, date: date, location: location, type: type,
                     distances: distances, organizer: organizer, sourceUrl: url, price: price };
        }
        var FALLBACK_EVENTS = [
            ev('mb-roosendaal-01', 'Veldtoertocht Roosendaal', D, 'Roosendaal', 'MTB', [23, 33, 43], 'WTC Roosendaal / Mountainbike.be', MB, '€ 6.00'),
            ev('mb-herentals-01', 'Toertocht Herentals', D, 'Herentals', 'Gravel', [55, 75], 'Mountainbike.be', MB, '€ 7.00'),
            ev('mb-minderhout-01', 'Veldtoertocht Minderhout', D, 'Minderhout', 'MTB', [23, 47, 50], 'Mountainbike.be', MB, '€ 6.00'),
            ev('mb-weelde-01', 'KWB Mountainbiketocht Weelde', D, 'Weelde', 'MTB', [20, 28, 37, 45, 55], 'Mountainbike.be', MB, '€ 5.00'),
            ev('mb-04', 'Limburgse Wandeldagen MTB & Gravel', D, 'As', 'Both', [27, 32, 46, 65, 80], 'Mountainbike.be', MB, '€ 8.00'),
            ev('mb-05', 'Offroad Tocht Baardegem', D, 'Baardegem', 'MTB', [25, 40, 55], 'Mountainbike.be', MB, '€ 6.00'),
            ev('mb-06', 'Scheldeland Veldtoertocht', D, 'Moerzeke', 'MTB', [18, 31, 48, 54], 'Mountainbike.be', MB, '€ 6.00'),
            ev('mb-07', 'Leiestreek Veldtoertocht', D, 'Sint-Martens-Latem', 'MTB', [20, 28, 35, 45, 55], 'Mountainbike.be', MB, '€ 6.00'),
            ev('mb-08', 'Hagelandse MTB Rit', D, 'Aarschot', 'MTB', [28, 50, 65], 'Mountainbike.be', MB, '€ 7.00'),
            ev('mb-09', 'Zoniënwoud Gravel Ride', D, 'Hoeilaart', 'Gravel', [20, 50, 75, 105], 'Mountainbike.be', MB, '€ 10.00'),
            ev('mb-10', 'Heuvelland Offroad Ieper', D, 'Ieper', 'MTB', [29, 34, 49, 55, 74, 79], 'Mountainbike.be', MB, '€ 8.00'),
            ev('mb-11', 'Veldtoertocht Lochristi', '2026-11-08', 'Lochristi', 'MTB', [28, 42, 55], 'Mountainbike.be / WTC Lochristi', MB, '€ 6.00'),
            ev('mb-12', 'Bos- en Heidetoertocht', '2026-11-15', 'Helchteren', 'MTB', [30, 43, 52], 'Mountainbike.be / MTB Helchteren', MB, '€ 7.00'),
            ev('mb-13', 'Kempen MTB Classic', '2026-11-22', 'Lille', 'MTB', [30, 45, 60], 'Mountainbike.be / WTC De Lindeboom', MB, '€ 7.00'),
            ev('mb-14', 'Oostakker Offroad Ride', '2026-11-29', 'Oostakker', 'Both', [35, 50, 70], 'Mountainbike.be / Offroad Club Gent', MB, '€ 8.00'),
            ev('fs-01', 'Grivelty Heuvelrug', '2026-11-15', 'Rhenen', 'Gravel', [65, 90, 120], 'Fietssport.nl', 'https://www.fietssport.nl/toertochten', '€ 18.50')
        ];

        // ---------- Hulpfuncties ----------
        function $(id) { return document.getElementById(id); }

        function esc(s) {
            return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
            });
        }

        function safeUrl(u) {
            return /^https?:\/\//i.test(u || '') ? u : '#';
        }

        function toNumbers(v) {
            if (v == null) return [];
            var arr = Array.isArray(v) ? v : (String(v).match(/\d+/g) || []);
            return arr.map(Number).filter(function (n) { return !isNaN(n); });
        }

        function normalizeDate(d) {
            if (!d) return '';
            var s = String(d), m = s.match(/^(\d{2})[-\/](\d{2})[-\/](\d{4})/);
            return m ? m[3] + '-' + m[2] + '-' + m[1] : s.slice(0, 10);
        }

        function normalizeType(t) {
            var s = String(t || '').toLowerCase();
            if (s.indexOf('both') > -1 || s.indexOf('beide') > -1 || (s.indexOf('mtb') > -1 && s.indexOf('gravel') > -1)) return 'Both';
            if (s.indexOf('gravel') > -1) return 'Gravel';
            return 'MTB';
        }

        function normalizeEvent(e, i) {
            return {
                id: e.id || ('ev-' + i),
                title: e.title || e.titel || e.name || 'Onbekende tocht',
                date: normalizeDate(e.date || e.datum),
                location: e.location || e.locatie || '',
                type: normalizeType(e.type),
                distances: toNumbers(e.distances != null ? e.distances : (e.distance != null ? e.distance : e.afstanden)),
                organizer: e.organizer || e.organisator || '',
                sourceUrl: e.sourceUrl || e.url || '#',
                price: e.price || e.prijs || '',
                lat: e.lat, lon: e.lon, source: e.source || '', country: e.country || '',
                start: e.start || '', startLat: e.startLat, startLon: e.startLon
            };
        }

        function dedupe(list) {
            var seen = {};
            return list.filter(function (e) {
                var key = [e.title, e.date, e.location].join('|').toLowerCase();
                if (seen[key]) return false;
                seen[key] = true;
                return true;
            });
        }

        // Dezelfde tocht als MTB- en gravelvariant (zelfde dag, plaats en titel op het type na) wordt één kaart
        var TYPE_ORDER = { MTB: 0, Gravel: 1, Both: 2 };
        var TYPE_WORDS = /\b(mtb|atb|vtt|gravelbike|gravelride|graveltocht|gravel)\b/gi;

        function titleKey(title) {
            return String(title).toLowerCase()
                .replace(TYPE_WORDS, ' ')
                .replace(/\b(toer)?tocht\b/g, ' ')
                .replace(/[^a-z0-9\u00c0-\u024f]+/g, ' ').trim();
        }

        function cleanTitle(title) {
            var t = String(title).replace(TYPE_WORDS, ' ').replace(/\s+/g, ' ').replace(/^[\s\-–]+|[\s\-–]+$/g, '');
            return t.length >= 3 ? t.charAt(0).toUpperCase() + t.slice(1) : title;
        }

        function mergeVariants(list) {
            var groups = [], index = {};
            list.forEach(function (e) {
                var tk = titleKey(e.title);
                var key = tk ? [e.date, e.location.toLowerCase(), tk].join('|') : null;
                var g = key ? index[key] : null;
                if (!g) {
                    g = { first: e, members: [] };
                    groups.push(g);
                    if (key) index[key] = g;
                }
                g.members.push(e);
            });
            return groups.map(function (g) {
                var byType = {};
                g.members.forEach(function (m) {
                    var v = byType[m.type] || (byType[m.type] = { type: m.type, distances: [] });
                    m.distances.forEach(function (d) { if (v.distances.indexOf(d) < 0) v.distances.push(d); });
                });
                var variants = Object.keys(byType).map(function (k) {
                    byType[k].distances.sort(function (a, b) { return a - b; });
                    return byType[k];
                }).sort(function (a, b) { return (TYPE_ORDER[a.type] || 0) - (TYPE_ORDER[b.type] || 0); });
                var out = {};
                Object.keys(g.first).forEach(function (k) { out[k] = g.first[k]; });
                if (g.members.length > 1) out.title = cleanTitle(g.first.title);
                out.variants = variants;
                out.ids = g.members.map(function (m) { return m.id; });
                return out;
            });
        }

        function prepare(list) { return mergeVariants(dedupe(list.map(normalizeEvent))); }

        // Afstand per auto (hemelsbreed x 1,3). null als de plaats onbekend is.
        function calculateDistance(origin, e) {
            var c1 = origin;
            var c2 = (e.lat != null && e.lon != null && !isNaN(+e.lat) && !isNaN(+e.lon))
                ? { lat: +e.lat, lon: +e.lon } : coordinates[e.location];
            if (!c1 || !c2) return null;
            var R = 6371, rad = function (x) { return x * Math.PI / 180; };
            var dLat = rad(c2.lat - c1.lat), dLon = rad(c2.lon - c1.lon);
            var a = Math.pow(Math.sin(dLat / 2), 2) +
                    Math.cos(rad(c1.lat)) * Math.cos(rad(c2.lat)) * Math.pow(Math.sin(dLon / 2), 2);
            return Math.round(R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a)) * 1.3);
        }

        function formatDate(iso) {
            var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso || '');
            if (!m) return iso || 'Datum onbekend';
            var d = new Date(+m[1], +m[2] - 1, +m[3]);
            return d.toLocaleDateString('nl-NL', { weekday: 'short', day: 'numeric', month: 'long', year: 'numeric' });
        }

        // ---------- Status ----------
        var allEvents = prepare(FALLBACK_EVENTS);
        var selectedType = 'Alle';
        var sourceLabel = 'ingebouwde data';

        // Startpunt: standaard 's-Heer Arendskerke, of de opgeslagen postcode
        var home = { lat: 51.488, lon: 3.864, label: "'s-Heer Arendskerke (standaard)" };
        try {
            var savedHome = JSON.parse(localStorage.getItem('mtb_home'));
            if (savedHome && savedHome.lat && savedHome.lon) home = savedHome;
        } catch (err) { /* standaard */ }

        function setHome(h) {
            home = h;
            try { localStorage.setItem('mtb_home', JSON.stringify(h)); } catch (err) { /* geen opslag */ }
            $('originLabel').textContent = 'Afstanden vanaf: ' + h.label;
            renderEvents();
        }

        function nominatimPostcode(digits, country) {
            return fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=' + country + '&postalcode=' + digits)
                .then(function (r) { return r.json(); })
                .then(function (res) {
                    if (!res || !res[0]) throw new Error('niet gevonden');
                    return { lat: +res[0].lat, lon: +res[0].lon, label: digits + ' ' + String(res[0].display_name).split(',')[0] };
                });
        }

        function geocodePostcode(pc, country) {
            var clean = pc.replace(/\s+/g, '').toUpperCase();
            var digits = clean.slice(0, 4);
            if (country === 'nl' && /^\d{4}[A-Z]{2}$/.test(clean)) {
                // PDOK: exact op volledige Nederlandse postcode
                return fetch('https://api.pdok.nl/bzk/locatieserver/search/v3_1/free?rows=1&fq=type:postcode&q=' + clean)
                    .then(function (r) { return r.json(); })
                    .then(function (j) {
                        var d = j.response && j.response.docs && j.response.docs[0];
                        var m = d && /POINT\(([-\d.]+) ([-\d.]+)\)/.exec(d.centroide_ll || '');
                        if (!m) throw new Error('niet gevonden');
                        return { lat: +m[2], lon: +m[1], label: digits + ' ' + clean.slice(4) + (d.woonplaatsnaam ? ' ' + d.woonplaatsnaam : '') };
                    })
                    .catch(function () { return nominatimPostcode(digits, country); });
            }
            return nominatimPostcode(digits, country);
        }

        function applyPostcode() {
            var pc = $('postcodeInput').value.trim(), lab = $('originLabel');
            if (!/^\d{4}\s?([A-Za-z]{2})?$/.test(pc)) {
                lab.textContent = 'Vul een geldige postcode in, bijvoorbeeld 4411AB of 2300.';
                return;
            }
            lab.textContent = 'Postcode zoeken...';
            geocodePostcode(pc, $('countrySelect').value).then(setHome).catch(function () {
                lab.textContent = 'Postcode niet gevonden. Controleer de postcode en het land.';
            });
        }

        // Onbekende tochtplaatsen zoeken we één keer op en onthouden we (max. 1 zoekopdracht per seconde)
        var geoCache = {};
        try { geoCache = JSON.parse(localStorage.getItem('mtb_geo') || '{}'); } catch (err) { geoCache = {}; }
        Object.keys(geoCache).forEach(function (k) { if (!coordinates[k]) coordinates[k] = geoCache[k]; });
        var geoQueue = [], geoBusy = false;

        function queueGeocode() {
            allEvents.forEach(function (e) {
                var own = e.lat != null && e.lon != null;
                if (e.location && !own && !coordinates[e.location] && geoQueue.indexOf(e.location) < 0) geoQueue.push(e.location);
            });
            if (!geoBusy) nextGeocode();
        }

        function nextGeocode() {
            var name = geoQueue.shift();
            if (!name) { geoBusy = false; return; }
            geoBusy = true;
            fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=nl,be,de,lu&q=' + encodeURIComponent(name))
                .then(function (r) { return r.json(); })
                .then(function (res) {
                    if (res && res[0]) {
                        var c = { lat: +res[0].lat, lon: +res[0].lon };
                        coordinates[name] = c; geoCache[name] = c;
                        try { localStorage.setItem('mtb_geo', JSON.stringify(geoCache)); } catch (err) { /* geen opslag */ }
                        renderEvents();
                    }
                })
                .catch(function () { /* overslaan */ })
                .then(function () { setTimeout(nextGeocode, 1100); });
        }
        // ---------- Kalender om een datum te kiezen ----------
        var MONTH_NAMES = ['januari', 'februari', 'maart', 'april', 'mei', 'juni', 'juli', 'augustus', 'september', 'oktober', 'november', 'december'];
        var calMonth = new Date(new Date().getFullYear(), new Date().getMonth(), 1);

        function pad2(n) { return (n < 10 ? '0' : '') + n; }
        function isoOf(y, m, d) { return y + '-' + pad2(m + 1) + '-' + pad2(d); }

        function renderCalendar() {
            var y = calMonth.getFullYear(), m = calMonth.getMonth();
            var counts = {};
            allEvents.forEach(function (e) { if (e.date) counts[e.date] = (counts[e.date] || 0) + 1; });
            var selected = $('dateInput').value;
            var now = new Date(), todayIso = isoOf(now.getFullYear(), now.getMonth(), now.getDate());
            var offset = (new Date(y, m, 1).getDay() + 6) % 7;   // week begint op maandag
            var days = new Date(y, m + 1, 0).getDate();
            var html = '<div class="flex items-center justify-between mb-3">' +
                '<button type="button" data-cal="prev" aria-label="Vorige maand" class="px-3 py-1 rounded hover:bg-slate-800 text-slate-300">‹</button>' +
                '<span class="text-sm font-semibold text-slate-100">' + MONTH_NAMES[m] + ' ' + y + '</span>' +
                '<button type="button" data-cal="next" aria-label="Volgende maand" class="px-3 py-1 rounded hover:bg-slate-800 text-slate-300">›</button></div>' +
                '<div class="grid grid-cols-7 gap-1 text-center text-xs text-slate-500 mb-1">' +
                ['ma', 'di', 'wo', 'do', 'vr', 'za', 'zo'].map(function (d) { return '<span>' + d + '</span>'; }).join('') +
                '</div><div class="grid grid-cols-7 gap-1">';
            for (var i = 0; i < offset; i++) html += '<span></span>';
            for (var d = 1; d <= days; d++) {
                var iso = isoOf(y, m, d), n = counts[iso] || 0;
                var cls = 'relative h-9 rounded-lg text-sm transition ';
                if (iso === selected) cls += 'bg-emerald-600 text-white font-semibold';
                else if (n) cls += 'bg-slate-800 text-slate-100 hover:bg-slate-700';
                else cls += 'text-slate-600 hover:bg-slate-800';
                if (iso === todayIso && iso !== selected) cls += ' ring-1 ring-emerald-500';
                html += '<button type="button" data-day="' + iso + '" class="' + cls + '" title="' + (n ? n + ' tochten' : 'Geen tochten') + '">' + d +
                    (n && iso !== selected ? '<span class="absolute bottom-1 left-1/2 -translate-x-1/2 w-1 h-1 rounded-full bg-emerald-400"></span>' : '') + '</button>';
            }
            html += '</div><div class="flex justify-between mt-3">' +
                '<button type="button" data-cal="clear" class="text-xs text-slate-400 hover:text-slate-200">Alle datums</button>' +
                '<button type="button" data-cal="today" class="text-xs text-emerald-400 hover:text-emerald-300">Vandaag</button></div>';
            $('calendarPop').innerHTML = html;
        }

        function setDate(iso) {
            $('dateInput').value = iso;
            $('dateBtnLabel').textContent = iso ? formatDate(iso) : 'Alle datums';
            $('calendarPop').classList.add('hidden');
            renderEvents();
        }

        // ---------- Google Agenda ----------
        var COUNTRY_NAMES = { NL: 'Nederland', BE: 'België', DE: 'Duitsland', LU: 'Luxemburg', FR: 'Frankrijk' };

        function okNum(v) { return v != null && v !== '' && !isNaN(+v); }

        // Startadres als dat bekend is, anders de plaats met het land erbij
        function placeText(e) {
            if (e.start) return e.start;
            return [e.location, COUNTRY_NAMES[e.country] || ''].filter(Boolean).join(', ');
        }

        // Google Maps-link: exacte startcoördinaten > startadres > coördinaten van de plaats > plaatsnaam
        function mapsUrl(e) {
            var q;
            if (okNum(e.startLat) && okNum(e.startLon)) q = (+e.startLat) + ',' + (+e.startLon);
            else if (e.start) q = e.start;
            else if (okNum(e.lat) && okNum(e.lon)) q = (+e.lat) + ',' + (+e.lon);
            else q = placeText(e);
            return 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(q);
        }

        function shortStart(e) {
            return String(e.start || '').replace(/,\s*(Nederland|België|Duitsland|Luxemburg|Frankrijk)$/, '');
        }

        function gcalUrl(e, variants) {
            if (!/^\d{4}-\d{2}-\d{2}$/.test(e.date || '')) return '';
            var day = e.date.replace(/-/g, '');
            var lines = variants.filter(function (v) { return v.distances.length; }).map(function (v) {
                return (v.type === 'Both' ? 'MTB & Gravel' : v.type) + ': ' + v.distances.join(', ') + ' km';
            });
            if (e.price) lines.push('Inschrijfgeld: ' + e.price);
            if (e.organizer) lines.push('Organisatie: ' + e.organizer);
            lines.push('Route: ' + mapsUrl(e));
            if (e.sourceUrl && e.sourceUrl !== '#') lines.push(e.sourceUrl);
            return 'https://calendar.google.com/calendar/render?action=TEMPLATE' +
                '&text=' + encodeURIComponent(e.title) +
                '&dates=' + day + 'T080000/' + day + 'T120000' +
                '&ctz=' + encodeURIComponent('Europe/Amsterdam') +
                '&location=' + encodeURIComponent(placeText(e)) +
                '&details=' + encodeURIComponent(lines.join('\n'));
        }

        // ---------- Renderen ----------
        function renderEvents() {
            var container = $('eventsContainer');
            var searchVal = $('searchInput').value.toLowerCase().trim();
            var dateVal = $('dateInput').value;
            var origin = home;
            var maxDist = parseInt($('maxDistance').value, 10);
            var minDist = parseInt($('minDistance').value, 10);

            var rows = allEvents.map(function (e) {
                var vs = e.variants.filter(function (v) {
                    return selectedType === 'Alle' || v.type === selectedType || v.type === 'Both';
                });
                return { ev: e, variants: vs, dist: calculateDistance(origin, e) };
            }).filter(function (r) {
                var e = r.ev;
                var text = (e.title + ' ' + e.location + ' ' + e.organizer).toLowerCase();
                var okLen = minDist === 0 || r.variants.some(function (v) {
                    return v.distances.length === 0 || v.distances.some(function (d) { return d >= minDist; });
                });
                return r.variants.length > 0
                    && text.indexOf(searchVal) > -1
                    && (!dateVal || e.date === dateVal)
                    && (r.dist === null || r.dist <= maxDist)
                    && okLen;
            });

            // Altijd op kortste reisafstand; onbekende afstand onderaan, daarna op datum
            rows.sort(function (a, b) {
                var da = a.dist === null ? 9999 : a.dist, db = b.dist === null ? 9999 : b.dist;
                return (da - db) || a.ev.date.localeCompare(b.ev.date);
            });

            $('statusLine').textContent = rows.length + ' van ' + allEvents.length + ' tochten (' + sourceLabel + '), gesorteerd op reisafstand';

            if (rows.length === 0) {
                container.innerHTML = '<div class="text-center py-12 text-slate-500 bg-slate-900 border border-slate-800 rounded-xl">Geen tochten gevonden voor deze selectie. Pas de filters of de datum aan.</div>';
                return;
            }

            container.innerHTML = rows.map(function (r) {
                var e = r.ev;
                var multi = r.variants.length > 1;
                var gcal = gcalUrl(e, r.variants);
                var badges = r.variants.map(function (v) {
                    var lbl = v.type === 'Both' ? 'MTB & Gravel' : v.type;
                    return '<span class="px-2.5 py-1 rounded text-xs font-semibold bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">' + esc(lbl) + '</span>';
                }).join('');
                var distHtml = r.variants.map(function (v) {
                    var chips = v.distances.map(function (d) {
                        return '<span class="bg-slate-800 text-slate-300 text-xs px-3 py-1.5 rounded-lg border border-slate-700">' + d + ' km</span>';
                    }).join('');
                    var label = multi ? '<span class="text-xs text-slate-500 min-w-[3.5rem]">' + esc(v.type === 'Both' ? 'MTB/Gravel' : v.type) + '</span>' : '';
                    return '<div class="flex flex-wrap items-center gap-2">' + label + chips + '</div>';
                }).join('');
                return '' +
                '<div class="bg-slate-900 border border-slate-800 rounded-xl p-6 flex flex-col md:flex-row justify-between items-start md:items-center gap-4 hover:border-slate-700 transition">' +
                    '<div class="space-y-2 flex-1">' +
                        '<div class="flex flex-wrap items-center gap-3">' +
                            badges +
                            '<span class="text-xs text-slate-400">📅 ' + esc(formatDate(e.date)) + '</span>' +
                            (r.dist !== null ? '<span class="text-xs text-rose-400 font-medium bg-rose-500/10 px-2 py-0.5 rounded border border-rose-500/20">🚗 ' + r.dist + ' km rijden</span>' : '') +
                        '</div>' +
                        '<div class="flex items-center gap-3">' +
                            '<h3 class="text-xl font-bold text-white">' + esc(e.title) + '</h3>' +
                        '</div>' +
                        '<div class="flex flex-wrap items-center gap-4 text-sm text-slate-400">' +
                            '<span>📍 ' + esc(e.location) + '</span>' +
                            (e.start ? '<a href="' + esc(mapsUrl(e)) + '" target="_blank" rel="noopener" class="text-slate-300 hover:underline" title="Open de startplaats in Google Maps">🏁 ' + esc(shortStart(e)) + '</a>' : '') +
                            '<span>👥 ' + esc(e.organizer || 'Onbekend') + '</span>' +
                            (e.price ? '<span class="text-emerald-400 font-medium">💶 ' + esc(e.price) + '</span>' : '') +
                            '<a href="' + esc(safeUrl(e.sourceUrl)) + '" target="_blank" rel="noopener" class="text-indigo-400 hover:underline">🔗 Bron bekijken</a>' +
                            (gcal ? '<a href="' + esc(gcal) + '" target="_blank" rel="noopener" class="text-emerald-400 hover:underline">📅 Zet in Google Agenda</a>' : '') +
                        '</div>' +
                    '</div>' +
                    '<div class="flex flex-col gap-2 md:items-end">' + distHtml + '</div>' +
                '</div>';
            }).join('');
        }

        // ---------- Bronstatus ----------
        var KNOWN_SOURCES = ['Mountainbike.be', 'Fietssport.nl', 'MTB-You', 'GoDare', 'Gravelbike.be'];
        var sourceInfo = null;

        function renderSources() {
            var html = KNOWN_SOURCES.map(function (name) {
                var info = sourceInfo && sourceInfo.sources.filter(function (s) { return s.name === name; })[0];
                var dot = 'bg-slate-600', text = 'geen gegevens', title = '';
                if (info && info.status === 'ok') {
                    dot = 'bg-emerald-500'; text = info.count + ' tochten';
                } else if (info && info.status === 'oud') {
                    dot = 'bg-amber-500'; text = info.count + ' tochten (oud)'; title = info.message || '';
                } else if (info && info.status === 'fout') {
                    dot = 'bg-rose-500';
                    text = /40[13]|429/.test(info.message || '') ? 'geen toegang' : 'niet beschikbaar';
                    title = info.message || '';
                } else if (info) {
                    text = 'nog niet gekoppeld';
                } else {
                    var n = allEvents.filter(function (e) { return e.source === name; }).length;
                    if (n) { dot = 'bg-emerald-500'; text = n + ' tochten'; }
                }
                return '<li class="flex items-center gap-2" title="' + esc(title) + '">' +
                    '<span class="inline-block w-2 h-2 rounded-full ' + dot + '"></span>' +
                    '<span class="text-slate-300">' + esc(name) + '</span>' +
                    '<span class="ml-auto text-slate-500">' + esc(text) + '</span></li>';
            }).join('');
            $('sourceList').innerHTML = html;
            var up = '';
            if (sourceInfo && sourceInfo.updated) {
                var d = new Date(sourceInfo.updated);
                if (!isNaN(d)) up = 'Laatst bijgewerkt: ' + d.toLocaleString('nl-NL', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
            }
            $('sourceUpdated').textContent = up;
        }

        function loadSources() {
            return fetch('sources.json?v=' + Date.now(), { cache: 'no-store' })
                .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
                .then(function (j) { if (j && Array.isArray(j.sources)) sourceInfo = j; })
                .catch(function () { /* geen bronstatus beschikbaar */ })
                .then(renderSources);
        }

        // ---------- events.json laden ----------
        function loadEvents() {
            return fetch('events.json?v=' + Date.now(), { cache: 'no-store' })
                .then(function (res) {
                    if (!res.ok) throw new Error('HTTP ' + res.status);
                    return res.json();
                })
                .then(function (raw) {
                    var list = Array.isArray(raw) ? raw : (raw && raw.events) || [];
                    if (list.length) {
                        allEvents = prepare(list);
                        sourceLabel = 'events.json';
                        queueGeocode();
                    }
                    console.log('events.json geladen:', list.length, 'ruw,', allEvents.length, 'na ontdubbelen');
                })
                .catch(function (err) {
                    console.warn('events.json niet geladen, fallback gebruikt:', err);
                })
                .then(renderEvents);
        }

        // ---------- Events koppelen ----------
        document.querySelectorAll('.type-btn').forEach(function (btn) {
            btn.addEventListener('click', function () {
                document.querySelectorAll('.type-btn').forEach(function (b) {
                    b.classList.remove('bg-emerald-600', 'text-white');
                    b.classList.add('bg-slate-800', 'text-slate-300');
                });
                btn.classList.remove('bg-slate-800', 'text-slate-300');
                btn.classList.add('bg-emerald-600', 'text-white');
                selectedType = btn.getAttribute('data-type');
                renderEvents();
            });
        });

        $('searchInput').addEventListener('input', renderEvents);
        $('dateBtn').addEventListener('click', function (ev) {
            ev.stopPropagation();
            var pop = $('calendarPop');
            if (pop.classList.contains('hidden')) {
                var sel = $('dateInput').value;
                if (sel) calMonth = new Date(+sel.slice(0, 4), +sel.slice(5, 7) - 1, 1);
                renderCalendar();
                pop.classList.remove('hidden');
            } else {
                pop.classList.add('hidden');
            }
        });
        $('calendarPop').addEventListener('click', function (ev) {
            ev.stopPropagation();
            var b = ev.target.closest('button');
            if (!b) return;
            var act = b.getAttribute('data-cal'), day = b.getAttribute('data-day');
            if (act === 'prev') { calMonth = new Date(calMonth.getFullYear(), calMonth.getMonth() - 1, 1); renderCalendar(); }
            else if (act === 'next') { calMonth = new Date(calMonth.getFullYear(), calMonth.getMonth() + 1, 1); renderCalendar(); }
            else if (act === 'clear') { setDate(''); }
            else if (act === 'today') { var t = new Date(); setDate(isoOf(t.getFullYear(), t.getMonth(), t.getDate())); }
            else if (day) { setDate($('dateInput').value === day ? '' : day); }
        });
        document.addEventListener('click', function () { $('calendarPop').classList.add('hidden'); });
        document.addEventListener('keydown', function (ev) { if (ev.key === 'Escape') $('calendarPop').classList.add('hidden'); });
        $('postcodeBtn').addEventListener('click', applyPostcode);
        $('postcodeInput').addEventListener('keydown', function (e) { if (e.key === 'Enter') applyPostcode(); });
        $('maxDistance').addEventListener('input', function (e) {
            $('maxDistVal').textContent = e.target.value;
            renderEvents();
        });
        $('minDistance').addEventListener('input', function (e) {
            $('minDistVal').textContent = e.target.value === '0' ? 'Alle' : e.target.value + ' km';
            renderEvents();
        });

        // Eerst direct tonen met fallback, daarna vervangen door events.json
        $('originLabel').textContent = 'Afstanden vanaf: ' + home.label;
        renderEvents();
        renderSources();
        loadEvents().then(loadSources);
    })();
    </script>
</body>
</html>
