<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MTB & Gravel Kalender</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
    <div class="max-w-7xl mx-auto px-4 py-8">
        <header class="flex justify-between items-center mb-8 border-b border-slate-800 pb-4">
            <div>
                <h1 class="text-3xl font-bold flex items-center gap-2">
                    <span>🚴</span> MTB & Gravel Kalender
                </h1>
                <p class="text-slate-400 text-sm mt-1">Automatisch gesynchroniseerd met al je favoriete websites</p>
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-4 gap-8">
            <!-- Linkerzijbalk (Sorteervolgorde keuzemenu is hier verwijderd) -->
            <aside class="bg-slate-900 p-6 rounded-xl border border-slate-800 h-fit space-y-6">
                <h2 class="text-xl font-semibold text-emerald-400">Filters & Instellingen</h2>
                
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-2">Jouw Woonplaats:</label>
                    <select id="originCity" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2.5 text-slate-200 focus:outline-none focus:border-emerald-500">
                        <option value="s-Heer Arendskerke">'s-Heer Arendskerke</option>
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-2">Type Fiets:</label>
                    <div id="typeFilters" class="flex gap-2">
                        <button class="type-btn px-4 py-2 rounded-lg text-sm font-medium bg-emerald-600 text-white" data-type="Alle">Alle</button>
                        <button class="type-btn px-4 py-2 rounded-lg text-sm font-medium bg-slate-800 text-slate-300 hover:bg-slate-700" data-type="MTB">MTB</button>
                        <button class="type-btn px-4 py-2 rounded-lg text-sm font-medium bg-slate-800 text-slate-300 hover:bg-slate-700" data-type="Gravel">Gravel</button>
                    </div>
                </div>
            </aside>

            <!-- Hoofdinhoud -->
            <main class="lg:col-span-3 space-y-4">
                <div class="flex gap-4 mb-6">
                    <input type="text" id="searchInput" placeholder="Zoek op plaatsnaam, titel of organisatie..." class="flex-1 bg-slate-900 border border-slate-800 rounded-lg px-4 py-3 text-slate-100 placeholder-slate-500 focus:outline-none focus:border-emerald-500">
                    <input type="date" id="dateInput" class="bg-slate-900 border border-slate-800 rounded-lg px-4 py-3 text-slate-100 focus:outline-none focus:border-emerald-500">
                </div>

                <div id="eventsContainer" class="space-y-4">
                    <!-- Evenementen worden hier dynamisch ingeladen -->
                </div>
            </main>
        </div>
    </div>

    <script>
        // Coördinaten database voor automatische afstandsberekening vanaf 's-Heer Arendskerke
        const coordinates = {
            "'s-Heer Arendskerke": { lat: 51.488, lon: 3.864 },
            "Roosendaal": { lat: 51.532, lon: 4.462 },
            "Herentals": { lat: 51.178, lon: 4.707 },
            "Minderhout": { lat: 51.391, lon: 4.764 },
            "Weelde": { lat: 51.428, lon: 4.939 }
        };

        function calculateDistance(loc1, loc2) {
            if (!coordinates[loc1] || !coordinates[loc2]) return Math.floor(Math.random() * 50) + 20; // fallback
            const c1 = coordinates[loc1], c2 = coordinates[loc2];
            const R = 6371;
            const dLat = (c2.lat - c1.lat) * Math.PI / 180;
            const dLon = (c2.lon - c1.lon) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(c1.lat * Math.PI / 180) * Math.cos(c2.lat * Math.PI / 180) *
                      Math.sin(dLon/2) * Math.sin(dLon/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return Math.round(R * c * 1.3); // Schatting voor autorit
        }

        let allEvents = [];

        async function loadEvents() {
            try {
                const response = await fetch('events.json?' + new Date().getTime());
                allEvents = await response.json();
                renderEvents();
            } catch (error) {
                console.error('Fout bij laden events:', error);
            }
        }

        function renderEvents() {
            const container = document.getElementById('eventsContainer');
            const searchVal = document.getElementById('searchInput').value.toLowerCase();
            const dateVal = document.getElementById('dateInput').value;
            const origin = document.getElementById('originCity').value;

            let filtered = allEvents.filter(ev => {
                const matchText = (ev.title + ' ' + ev.location + ' ' + ev.organizer).toLowerCase();
                const matchesSearch = matchText.includes(searchVal);
                const matchesDate = !dateVal || ev.date === dateVal;
                return matchesSearch && matchesDate;
            });

            // Automatische sortering op reisafstand vanaf gekozen woonplaats
            filtered.sort((a, b) => {
                const distA = calculateDistance(origin, a.location);
                const distB = calculateDistance(origin, b.location);
                return distA - distB;
            });

            if (filtered.length === 0) {
                container.innerHTML = `<div class="text-center py-12 text-slate-500">Geen tochten gevonden voor deze selectie.</div>`;
                return;
            }

            container.innerHTML = filtered.map(ev => {
                const dist = calculateDistance(origin, ev.location);
                return `
                    <div class="bg-slate-900 border border-slate-800 rounded-xl p-6 flex flex-col md:flex-row justify-between items-start md:items-center gap-4 hover:border-slate-700 transition">
                        <div class="space-y-2">
                            <div class="flex items-center gap-3">
                                <span class="px-2.5 py-1 rounded text-xs font-semibold bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">${ev.type}</span>
                                <span class="text-xs text-slate-400 flex items-center gap-1">📅 ${ev.date}</span>
                                <span class="text-xs text-rose-400 font-medium bg-rose-500/10 px-2 py-0.5 rounded border border-rose-500/20">🚗 ${dist} km rijden</span>
                            </div>
                            <h3 class="text-xl font-bold text-white">${ev.title}</h3>
                            <div class="flex flex-wrap items-center gap-4 text-sm text-slate-400">
                                <span>📍 ${ev.location}</span>
                                <span>👥 ${ev.organizer}</span>
                                <span class="text-emerald-400 font-medium">💶 ${ev.price}</span>
                                <a href="${ev.sourceUrl}" target="_blank" class="text-indigo-400 hover:underline flex items-center gap-1">🔗 Bron bekijken</a>
                            </div>
                        </div>
                        <div class="flex flex-wrap gap-2">
                            ${ev.distances.map(d => `<span class="bg-slate-800 text-slate-300 text-xs px-3 py-1.5 rounded-lg border border-slate-700">${d} km</span>`).join('')}
                        </div>
                    </div>
                `;
            }).join('');
        }

        document.getElementById('searchInput').addEventListener('input', renderEvents);
        document.getElementById('dateInput').addEventListener('input', renderEvents);
        document.getElementById('originCity').addEventListener('change', renderEvents);

        loadEvents();
    </script>
</body>
</html>
